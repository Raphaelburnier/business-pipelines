# Le cockpit sur le NAS, joint par Tailscale, et le pipeline marketing lancé à la demande.
#
# Le relais du cockpit n'écoute que sur la boucle locale de l'hôte ; Tailscale le joint.
# C'est la même contrainte que sur le poste, et pour la même raison : les en-têtes
# d'identité que Tailscale injecte ne sont fiables que si le service reste local.

services:
  cockpit:
    build: .
    container_name: business_cockpit
    # `always`, pas `unless-stopped` : DSM arrête les conteneurs par `docker stop` quand le
    # NAS s'éteint, ce qui compte comme un arrêt manuel. Après le redémarrage du 2026-09-23,
    # aucun n'est revenu seul.
    restart: always
    # Réseau de confiance séparé de celui du runner. Le socket Unix atteste le relais ;
    # aucun port du cockpit n'est publié sur l'hôte.
    networks:
      - business
    volumes:
      # Les approbations sont l'état durable : registres de décisions, plans gelés, journal
      # d'exécution. Dans l'image, un rebuild les effacerait.
      - ./approvals:/app/approvals
      # Les fichiers de configuration portent les secrets. Montés, jamais construits dans
      # l'image, et en lecture seule : rien du conteneur n'a de raison de les réécrire.
      - ./specs:/app/specs:ro
      - ./logs:/app/logs
      # Le socket vers lequel `tailscale serve` relaie (docs/SECURITE-COMMANDES.md). Le runner
      # ne monte pas ce dossier : ses agents ne peuvent pas emprunter ce chemin d'identité.
      - ./run-cockpit:/run/cockpit
      # L'event store des runs (§9). Le cockpit le lit ; le moteur et le maître y écrivent.
      # Monté en écriture parce que SQLite pose un journal WAL à l'ouverture, même pour
      # une lecture — pas parce que le cockpit y écrirait quoi que ce soit.
      - ./etat:/app/etat
      - ./projects:/app/projects:ro
      # Préparer les missions depuis les profils et pipelines du registre livré.
      - ./agent-registry:/app/agent-registry:ro
      # Profils, références et jobs en cours.
      - ${AI_STUDIO_WORK_PATH:-./ai-studio-data}:/data/ai-studio-work
      # Seules les générations terminées et validées sont archivées ici.
      - ${AI_STUDIO_ARCHIVE_PATH:-/volume1/IAstudio}:/data/ai-studio-archive
      # Bibliothèque de modèles lue directement par Comfy Desktop sur le PC.
      - ${AI_STUDIO_MODELS_PATH:-/volume1/IA_Studio_Model}:/data/ai-studio-models
    environment:
      - NODE_ENV=production
      - ORCH_EVENT_STORE=/app/etat/events.sqlite
      - ORCH_REGISTRE=/app/agent-registry
      - ORCH_MACHINE=nas
      - COCKPIT_VIA_MACHINES=nas:claude;pc:claude,omniroute,codex
      # Le nom du NAS dans le tailnet, pas celui du poste.
      - COCKPIT_TAILNET=nas.tail8296f6.ts.net
      - COCKPIT_SOCKET=/run/cockpit/cockpit.sock
      # Une identité reçue par TCP interne est toujours refusée. Le relais local est le
      # seul chemin réseau vers le socket, absent des montages du runner.
      - COCKPIT_IDENTITE_SOCKET_SEULE=1
      # La clé qui signe fusions, rattachements et livraisons ; absente du runner.
      - COMMANDES_CLE_FICHIER=/app/specs/cles/commandes.key
      # Écoute interne au réseau Docker, sans publication ; le relais utilise le socket.
      # L'option explicite conserve le refus d'une ouverture accidentelle hors conteneur.
      - COCKPIT_HOTE=0.0.0.0
      - COCKPIT_CONTENEUR=1
      - AI_STUDIO_STORAGE_ROOT=/data/ai-studio-work
      - AI_STUDIO_ARCHIVE_ROOT=/data/ai-studio-archive
      - AI_STUDIO_MODELS_ROOT=/data/ai-studio-models
      - AI_STUDIO_MAX_CONCURRENT_JOBS=${AI_STUDIO_MAX_CONCURRENT_JOBS:-2}
    # Pas d'`env_file` ici, délibérément : le cockpit ne reçoit AUCUNE clé Anthropic.
    # Il sert une page et écrit des décisions, il ne planifie rien. Lui donner de quoi
    # appeler un modèle ferait du processus exposé au tailnet un moyen de dépenser, ce que
    # tout le reste du dépôt s'emploie à empêcher.

  # Le runner reçoit les identifiants des modèles. Le cockpit dépose une commande dans
  # SQLite ; le runner la prend, lance le pipeline, puis consigne son résultat. Cette
  # séparation empêche le processus exposé au tailnet d'appeler directement un modèle.
  runner:
    build: .
    container_name: business_runner
    # `always`, pas `unless-stopped` : DSM arrête les conteneurs par `docker stop` quand le
    # NAS s'éteint, ce qui compte comme un arrêt manuel. Après le redémarrage du 2026-09-23,
    # aucun n'est revenu seul.
    restart: always
    command: ["node", "bin/commande-runner.js"]
    volumes:
      - ./etat:/app/etat
      # Qui peut relancer une CI ou écrire sur une PR : les conseillers de « Demander »
      # agissent au nom de la question, et leur droit se lit ici comme pour les boutons.
      - ./specs/livraison.json:/app/specs/livraison.json:ro
      - ./projects:/app/projects:ro
      - ./agent-registry:/app/agent-registry:ro
      - ./workspaces:/app/workspaces
      - ./logs:/app/logs
      # Un dépôt par projet, jamais le dossier entier : les agents de ce conteneur ont Bash,
      # et monter /volume1/docker/git leur donnait les dépôts de tous les autres projets.
      # Monté en écriture, parce que le run pousse sa branche run/<runId>.
      - /volume1/docker/git/steam-tierlist.git:/git/steam-tierlist.git
      # Le marketing, lancé depuis le cockpit : son dépôt (le worker du PC y accède par SSH,
      # repoWorkers dans projects/marketing/project.json) et sa spec seule, pas tout specs/.
      - /volume1/docker/git/marketing.git:/git/marketing.git
      - ./specs/marketing.json:/app/specs/marketing.json:ro
      # Les objectifs « À venir » se traitent dans le cockpit et le moteur. Dépôts de travail
      # distincts des miroirs de /git/systeme, que le livreur lit comme source de confiance :
      # un agent n'y pousse jamais.
      - /volume1/docker/git/business-pipelines.git:/git/business-pipelines.git
      - /volume1/docker/git/agent-orchestrator.git:/git/agent-orchestrator.git
      # La connexion Codex du conseiller de « Demander » (codex login --device-auth, une
      # fois). Hors de l'image et hors de specs/. Les agents de ce conteneur ont Bash et
      # sous l'uid dédié ne lisent pas /root ; le jeton Claude dans leur environnement
      # reste le chantier F14 distinct du présent lot.
      - ./codex:/root/.codex
    environment:
      - NODE_ENV=production
      - ORCH_EVENT_STORE=/app/etat/events.sqlite
      - ORCH_MACHINE=nas
      - ORCH_REGISTRE=/app/agent-registry
      # Une tâche de développement exige le PC déjà disponible. Une course entre le clic
      # et le dispatch échoue clairement au lieu d'envoyer un paquet Wake-on-LAN.
      - ORCH_REVEIL_MACHINE=0
      - ORCH_MAITRE_EXTERNE=1
      - OUTPUT_ROOT=/app/workspaces
      # Les agents tournent sous l'uid 1100 (utilisateur `agent` de l'image), pas en root :
      # ils n'écrivent plus dans etat/ et ne lisent plus /root (agent-orchestrator, lot 0.6).
      - ORCH_AGENT_UTILISATEUR=1100:1100
      - ORCH_ROLE=nas
      # Le dépôt monté appartient à admindunas, le runner tourne en root : sans cette
      # exception, git refuse de le cloner (« dubious ownership »). Posé en variables
      # d'environnement, qui comptent comme configuration protégée pour git, pour survivre à
      # la recréation du conteneur. Le premier run du 2026-09-25 a échoué là.
      - GIT_CONFIG_COUNT=4
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/git/steam-tierlist.git
      - GIT_CONFIG_KEY_1=safe.directory
      - GIT_CONFIG_VALUE_1=/git/marketing.git
      - GIT_CONFIG_KEY_2=safe.directory
      - GIT_CONFIG_VALUE_2=/git/business-pipelines.git
      - GIT_CONFIG_KEY_3=safe.directory
      - GIT_CONFIG_VALUE_3=/git/agent-orchestrator.git
    env_file:
      - ./specs/deploiement.env
    # Les agents n'ont ni la boucle locale du NAS, ni le réseau du cockpit.
    networks:
      - execution
    depends_on:
      - maitre

  # Le maître garde l'adresse réelle du worker : sur DSM, une publication Docker bridge
  # la remplace par l'adresse de passerelle. Ce service ne lance aucun agent ; il reprend
  # la configuration d'exécution que le maître intégré utilisait pour les dispatchs.
  maitre:
    build: .
    container_name: business_maitre
    restart: always
    command: ["node", "bin/maitre-permanent.js"]
    volumes:
      - ./etat:/app/etat
      - ./specs/workers.json:/app/specs/workers.json:ro
    environment:
      - NODE_ENV=production
      - ORCH_EVENT_STORE=/app/etat/events.sqlite
      - ORCH_WORKERS=/app/specs/workers.json
      - ORCH_REVEIL_MACHINE=0
      - ORCH_TAILNET_WHOIS_URL=http://127.0.0.1:4651
    env_file:
      - ./specs/deploiement.env
    network_mode: host
    depends_on:
      - tailscale-whois

  # Tailscale DSM relaie vers la boucle locale. Ce service sans agents transmet au
  # socket Unix ; le cockpit n'accepte aucune identité sur son port TCP interne.
  cockpit-relais:
    build: .
    container_name: business_cockpit_relais
    restart: always
    command: ["node", "deploy/nas/cockpit-relais.js"]
    volumes:
      - ./run-cockpit:/run/cockpit:ro
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - cockpit

  # Publie les runs réussis : pousse les branches agent/… des dépôts du NAS vers GitHub et
  # ouvre leur PR ; ramène aussi la branche par défaut de GitHub dans le dépôt du NAS
  # (décision du 2026-09-27, option B). Seul service qui détient un jeton GitHub : il ne
  # fait tourner aucun agent, contrairement au runner, dont les agents ont Bash.
  publieur:
    build: .
    container_name: business_publieur
    restart: always
    command: ["node", "bin/publieur.js"]
    volumes:
      - ./projects:/app/projects:ro
      - ./etat:/app/etat
      - /volume1/docker/git:/git
      # Qui peut fusionner une PR depuis le cockpit : la liste de ceux qui livrent, relue à
      # chaque commande `github.merge`. Ce fichier seul, en lecture.
      - ./specs/livraison.json:/app/specs/livraison.json:ro
      # La clé qui vérifie les commandes signées par le cockpit.
      - ./specs/cles:/app/cles:ro
    environment:
      - NODE_ENV=production
      - PUBLIEUR_ETAT=/app/etat/publications.json
      - COMMANDES_CLE_FICHIER=/app/cles/commandes.key
      # La file des fusions demandées depuis le cockpit (src/pull-requests.js).
      - ORCH_EVENT_STORE=/app/etat/events.sqlite
      # Miroirs des dépôts système, lus sans jeton par le livreur (docs/SPEC-livraison.md).
      - PUBLIEUR_MIROIRS=business-pipelines=Raphaelburnier/business-pipelines,agent-orchestrator=Raphaelburnier/agent-orchestrator,agent-registry=Raphaelburnier/agent-registry
      - PUBLIEUR_MIROIRS_DIR=/git/systeme
    env_file:
      - ./specs/publieur.env
    networks:
      - business

  # Met en production la version du cockpit que Raphaël valide dans le cockpit
  # (docs/SPEC-livraison.md). Seul service qui tient le socket Docker, donc root sur le NAS :
  # en échange, il n'écoute rien, ne reçoit ni jeton ni clé dans son environnement, ne fait
  # tourner aucun agent, et ne construit que des commits des miroirs fusionnés sur leur
  # branche par défaut. Il monte le dossier du cockpit, specs/ compris : avec le socket il
  # pourrait de toute façon tout lire, ce montage ne lui donne rien de plus. deploy.sh ne le
  # recrée jamais : il ne
  # se livre pas lui-même, sa mise à jour passe par `bin/livrer.sh --livreur`.
  livreur:
    build:
      context: .
      target: livreur
    container_name: business_livreur
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mêmes chemins que sur l'hôte : deploy.sh et `docker compose` y résolvent les chemins
      # du compose, que le démon Docker lit ensuite sur l'hôte.
      - /volume1/docker/business-pipelines:/volume1/docker/business-pipelines
      - /volume1/docker/releases:/volume1/docker/releases
      - /volume1/docker/business-pipelines-backups:/volume1/docker/business-pipelines-backups
      - /volume1/docker/git/systeme:/git/systeme:ro
    environment:
      - NODE_ENV=production
      - ORCH_EVENT_STORE=/volume1/docker/business-pipelines/etat/events.sqlite
      - DOCKER=/usr/bin/docker
      - COMMANDES_CLE_FICHIER=/volume1/docker/business-pipelines/specs/cles/commandes.key
    # deploy.sh contrôle le cockpit sur 127.0.0.1:4600, publié sur la boucle locale de l'hôte.
    network_mode: host

  # Le runner exécute du code produit par des agents : lui monter le socket LocalAPI de
  # Tailscale lui donnerait bien plus que `whois`. Ce relais séparé possède le socket mais
  # n'expose qu'une lecture d'identité sur 127.0.0.1.
  tailscale-whois:
    build: .
    container_name: business_tailscale_whois
    restart: always
    command: ["node", "/agent-orchestrator/bin/orch-whois-proxy.js"]
    volumes:
      - /var/packages/Tailscale/target/bin/tailscale:/usr/local/bin/tailscale:ro
      - /var/packages/Tailscale/var/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    environment:
      - NODE_ENV=production
      - ORCH_TAILSCALE_SOCKET=/var/run/tailscale/tailscaled.sock
      - ORCH_WHOIS_PROXY_HOTE=127.0.0.1
      - ORCH_WHOIS_PROXY_PORT=4651
    network_mode: host

  # Le pipeline marketing, lancé à la demande, jamais en continu :
  #
  #   sudo docker compose run --rm marketing
  #
  # Le profil `manuel` le tient hors de `docker compose up -d`. Un tour coûte des appels
  # Anthropic et s'arrête de lui-même sur une décision humaine : rien là-dedans ne doit
  # rester debout, et un redémarrage automatique repaierait un tour à chaque sortie. C'est
  # exactement la panne qu'avait le conteneur du cycle avant qu'une boucle porte l'attente.
  marketing:
    build: .
    profiles: ["manuel"]
    command: ["node", "orchestrator.js", "marketing", "./specs/marketing.json"]
    volumes:
      # Le plan gelé et la boîte d'attente s'écrivent ici, là où le cockpit les lit. Sans ce
      # montage, le tour déposerait sa demande dans le conteneur et le cockpit ne verrait rien.
      - ./approvals:/app/approvals
      - ./specs:/app/specs:ro
      # Le workspace, le rapport et le coût du tour survivent au conteneur jetable.
      - ./runs:/app/runs
      - ./logs:/app/logs
      - ./etat:/app/etat
    environment:
      - NODE_ENV=production
      # Le run écrit ici ce que le cockpit lira : même fichier, deux conteneurs.
      - ORCH_EVENT_STORE=/app/etat/events.sqlite
    # La clé Anthropic vit dans ce fichier de l'hôte et n'entre jamais dans l'image. Le
    # cockpit, lui, n'en reçoit toujours aucune.
    env_file:
      - ./specs/deploiement.env
    networks:
      - business

networks:
  business:
    driver: bridge
  execution:
    driver: bridge
