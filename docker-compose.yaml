# Le cockpit sur le NAS, joint par Tailscale, et le pipeline marketing lancé à la demande.
#
# Le cockpit n'écoute que sur la boucle locale de l'hôte, et Tailscale relaie vers lui.
# C'est la même contrainte que sur le poste, et pour la même raison : les en-têtes
# d'identité que Tailscale injecte ne sont fiables que si le service reste local.

services:
  cockpit:
    build: .
    container_name: business_cockpit
    restart: unless-stopped
    ports:
      # Boucle locale de l'hôte uniquement. Écrire "4600:4600" publierait le cockpit sur
      # tout le réseau, et n'importe quelle machine du LAN pourrait alors fabriquer
      # l'en-tête Tailscale-User-Login et signer des décisions sous ton nom.
      - "127.0.0.1:4600:4600"
    # Un réseau à lui. Lier toutes les interfaces DANS le conteneur le rend joignable par
    # les autres conteneurs du même réseau, et le NAS en porte sept. Ce réseau-ci n'a que
    # le cockpit et le cycle, qui sont déjà du même dépôt et lisent les mêmes fichiers.
    networks:
      - business
    volumes:
      # Les approbations sont l'état durable : registres de décisions, plans gelés, journal
      # d'exécution. Dans l'image, un rebuild les effacerait.
      - ./approvals:/app/approvals
      # Les fichiers de configuration portent les secrets. Montés, jamais construits dans
      # l'image, et en lecture seule : rien du conteneur n'a de raison de les réécrire.
      - ./specs:/app/specs:ro
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      # Le nom du NAS dans le tailnet, pas celui du poste.
      - COCKPIT_TAILNET=nas.tail8296f6.ts.net
      # Lier 127.0.0.1 dans un conteneur ne confine rien, ça rend le service injoignable :
      # la publication ci-dessus relaie vers l'adresse du conteneur sur son réseau, jamais
      # vers sa boucle locale à lui, et la connexion est réinitialisée. Le cockpit du NAS a
      # tourné dix jours dans cet état, « Up » pour Docker et muet pour tout le monde.
      # Le confinement passe donc à la publication loopback de l'hôte, qui est ce que
      # Tailscale exige de toute façon pour que ses en-têtes d'identité veuillent dire
      # quelque chose. COCKPIT_CONTENEUR=1 est la reconnaissance explicite de ce
      # déplacement : sans elle le cockpit refuse de démarrer sur autre chose que la
      # boucle locale, pour qu'une faute de frappe dans un .env du poste ne l'ouvre pas
      # sur le LAN.
      - COCKPIT_HOTE=0.0.0.0
      - COCKPIT_CONTENEUR=1
    # Pas d'`env_file` ici, délibérément : le cockpit ne reçoit AUCUNE clé Anthropic.
    # Il sert une page et écrit des décisions, il ne planifie rien. Lui donner de quoi
    # appeler un modèle ferait du processus exposé au tailnet un moyen de dépenser, ce que
    # tout le reste du dépôt s'emploie à empêcher.

  # Le pipeline marketing, lancé à la demande, jamais en continu :
  #
  #   sudo docker compose run --rm marketing
  #
  # Le profil `manuel` le tient hors de `docker compose up -d`. Un tour coûte des appels
  # Anthropic et s'arrête de lui-même sur une décision humaine : rien là-dedans ne doit
  # rester debout, et un redémarrage automatique repaierait un tour à chaque sortie. C'est
  # exactement la panne qu'avait le conteneur du cycle avant qu'une boucle porte l'attente.
  marketing:
    build: .
    profiles: ["manuel"]
    command: ["node", "orchestrator.js", "marketing", "./specs/marketing.json"]
    volumes:
      # Le plan gelé et la boîte d'attente s'écrivent ici, là où le cockpit les lit. Sans ce
      # montage, le tour déposerait sa demande dans le conteneur et le cockpit ne verrait rien.
      - ./approvals:/app/approvals
      - ./specs:/app/specs:ro
      # Le workspace, le rapport et le coût du tour survivent au conteneur jetable.
      - ./runs:/app/runs
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
    # La clé Anthropic vit dans ce fichier de l'hôte et n'entre jamais dans l'image. Le
    # cockpit, lui, n'en reçoit toujours aucune.
    env_file:
      - ./specs/deploiement.env
    networks:
      - business

networks:
  business:
    driver: bridge
