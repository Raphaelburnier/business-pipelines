name: CI

# Sur les PR, et aussi sur main après chaque fusion et chaque nuit : une PR du moteur peut
# casser le cockpit sans toucher à ce dépôt (2026-10-15, moteur #54 sans cockpit #108). La
# livraison l'aurait vu au moment de construire ; ces passages le voient avant.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out business-pipelines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: business-pipelines
          fetch-depth: 2

      - name: "Verify tested merge (merge=${{ github.sha }}, head=${{ github.event.pull_request.head.sha }}, base=${{ github.event.pull_request.base.sha }})"
        if: github.event_name == 'pull_request'
        working-directory: business-pipelines
        shell: bash
        env:
          EXPECTED_MERGE: ${{ github.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Ce triplet est relu dans les métadonnées du job par le publieur du cockpit.
          # Un checkout de la tête seule ou d'une autre base ne peut pas produire la preuve.
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MERGE" ]]
          [[ "$(git rev-list --parents -n 1 HEAD | wc -w)" == "3" ]]
          [[ "$(git rev-parse HEAD^2)" == "$EXPECTED_HEAD" ]]
          tested_base="$(git rev-parse HEAD^1)"
          [[ "$tested_base" == "$EXPECTED_BASE" ]]
          git fetch --no-tags --depth=1 origin "refs/heads/${GITHUB_BASE_REF}"
          current_base="$(git rev-parse FETCH_HEAD)"
          [[ "$tested_base" == "$current_base" ]] || {
            echo "The pull-request merge ref is stale (tested=$tested_base current=$current_base)." >&2
            exit 1
          }

      - name: Check out the private engine read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Raphaelburnier/agent-orchestrator
          # La branche par défaut du moteur, celle que la livraison construit avec le cockpit
          # (proposition « disponible » du livreur). Un SHA épinglé testait un autre moteur que
          # celui livré : CI verte, livraison cassée. Une PR cockpit qui attend un changement du
          # moteur passe donc après la fusion de celui-ci.
          path: agent-orchestrator
          ssh-key: ${{ secrets.AGENT_ORCHESTRATOR_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install engine dependencies
        working-directory: agent-orchestrator
        run: npm ci

      - name: Install cockpit dependencies
        working-directory: business-pipelines
        run: npm ci

      - name: Install web dependencies
        working-directory: business-pipelines/web
        run: npm ci

      - name: Run server tests
        working-directory: business-pipelines
        run: npm test

      # Les outils de sauvegarde s’exécutent sur le PC Linux (Python/flock), pas dans l’image servie.
      - name: Verify off-NAS backup and isolated restore
        working-directory: business-pipelines
        run: npm run test:sauvegardes

      - name: Run web tests and typecheck
        working-directory: business-pipelines
        run: npm run web:test

      - name: Build web application
        working-directory: business-pipelines/web
        run: npm run build

      - name: Verify Docker build dependencies and tests
        working-directory: business-pipelines
        shell: bash
        run: |
          set -euo pipefail
          # Le runner Ubuntu possède jq ; l'image Alpine peut manquer une dépendance.
          # Construire le même étage que la livraison pour les changements qui affectent
          # l'image, ses dépendances, ses tests ou le moteur épinglé.
          if git diff --quiet HEAD^1 HEAD -- Dockerfile .dockerignore package.json package-lock.json web/package.json web/package-lock.json test .github/workflows/ci.yml; then
            echo "No image, dependency or verification changes."
            exit 0
          fi
          bash bin/preparer-image.sh
          docker build --target verification --tag cockpit-ci-verification .
