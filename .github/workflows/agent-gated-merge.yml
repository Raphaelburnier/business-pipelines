name: Auto-merge for internal agent PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to diagnose or merge"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  gate-and-merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_PR: ${{ inputs.pr_number }}
    steps:
      - name: Evaluate gates and merge
        shell: bash
        run: |
          set -euo pipefail

          pr_number=""
          sha=""
          ci_state="not checked"
          sensitive_files="none"
          gate="event"

          refuse() {
            local reason="$1"
            {
              echo "## Gated merge decision: refused"
              echo
              echo "- **PR:** ${pr_number:-unresolved}"
              echo "- **HEAD SHA:** ${sha:-unresolved}"
              echo "- **Gate:** $gate"
              echo "- **Reason:** $reason"
              echo "- **CI:** $ci_state"
              echo "- **Sensitive files:** $sensitive_files"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Refused: gate=$gate reason=$reason"
            exit 0
          }

          command -v gh >/dev/null || { gate="runner"; refuse "gh is unavailable"; }
          command -v jq >/dev/null || { gate="runner"; refuse "jq is unavailable"; }

          repo_json="$(gh api "repos/$REPOSITORY")" || {
            gate="repository"
            refuse "repository metadata could not be read"
          }
          default_branch="$(jq -r '.default_branch // empty' <<<"$repo_json")"
          [[ -n "$default_branch" ]] || {
            gate="repository"
            refuse "default branch could not be determined"
          }

          event="$(cat "$GITHUB_EVENT_PATH")"
          case "$EVENT_NAME" in
            workflow_run)
              [[ "$(jq -r '.workflow_run.name // empty' <<<"$event")" == "CI" ]] || {
                gate="workflow identity"
                refuse "workflow_run was not produced by the exact CI workflow"
              }
              [[ "$(jq '[.workflow_run.pull_requests[]?.number] | unique | length' <<<"$event")" == "1" ]] || {
                gate="PR resolution"
                refuse "workflow_run does not identify exactly one pull request"
              }
              pr_number="$(jq -r '[.workflow_run.pull_requests[]?.number] | unique | .[0]' <<<"$event")"
              sha="$(jq -r '.workflow_run.head_sha // empty' <<<"$event")"
              ;;
            workflow_dispatch)
              pr_number="${DISPATCH_PR:-}"
              [[ "$pr_number" =~ ^[0-9]+$ ]] || {
                gate="PR resolution"
                refuse "workflow_dispatch requires a numeric pr_number"
              }
              ;;
            *)
              refuse "unsupported event"
              ;;
          esac

          pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")" || {
            gate="PR metadata"
            refuse "pull request metadata could not be read"
          }
          state="$(jq -r '.state // empty' <<<"$pr")"
          if [[ "$state" != "open" ]]; then
            if [[ "$state" == "closed" && "$(jq -r '.merged' <<<"$pr")" == "true" ]]; then
              echo "PR $pr_number is already merged; no action required." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gate="PR state"
            refuse "pull request is not open"
          fi
          [[ "$(jq -r '.draft' <<<"$pr")" == "false" ]] || {
            gate="PR state"
            refuse "pull request is draft"
          }
          [[ "$(jq -r '.base.ref // empty' <<<"$pr")" == "$default_branch" ]] || {
            gate="base branch"
            refuse "base branch is not the repository default branch"
          }
          [[ "$(jq -r '.head.repo.full_name // empty' <<<"$pr")" == "$REPOSITORY" ]] || {
            gate="repository boundary"
            refuse "pull request is from a fork or another repository"
          }

          head_ref="$(jq -r '.head.ref // empty' <<<"$pr")"
          case "$head_ref" in
            codex/*|claude/*|agent/*|automation/*) ;;
            *) gate="source branch"; refuse "source branch is outside the trusted prefixes" ;;
          esac

          current_pr_sha="$(jq -r '.head.sha // empty' <<<"$pr")"
          event_sha="${sha:-$current_pr_sha}"
          [[ "$event_sha" == "$current_pr_sha" ]] || {
            gate="HEAD snapshot"
            refuse "event HEAD does not match the current PR HEAD"
          }
          sha="$event_sha"

          base_commit="$(gh api "repos/$REPOSITORY/commits/$default_branch")" || {
            gate="base branch"
            refuse "default branch commit could not be read"
          }
          base_sha="$(jq -r '.sha // empty' <<<"$base_commit")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || {
            gate="base branch"
            refuse "default branch snapshot is incomplete"
          }

          ci_runs="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100")" || {
            gate="CI"
            refuse "CI workflow runs could not be read"
          }
          latest_ci="$(jq -c --arg sha "$sha" '
            [.workflow_runs[]
              | select(.name == "CI" and .head_sha == $sha and .event == "pull_request")]
            | sort_by(.run_number, .run_attempt)
            | last // {}
          ' <<<"$ci_runs")"
          ci_state="$(jq -r 'if .status == "completed" then (.conclusion // "unknown") else (.status // "missing") end' <<<"$latest_ci")"
          [[ "$ci_state" == "success" ]] || {
            gate="CI"
            refuse "latest exact-head pull-request CI conclusion is not success"
          }
          [[ "$(jq -r '.total_count' <<<"$ci_runs")" =~ ^[0-9]+$ ]] && [[ "$(jq -r '.total_count' <<<"$ci_runs")" -le 100 ]] || {
            gate="CI pagination"
            refuse "CI run list is incomplete; cannot identify the latest run"
          }
          ci_id="$(jq -r '.id // empty' <<<"$latest_ci")"
          ci_attempt="$(jq -r '.run_attempt // empty' <<<"$latest_ci")"
          [[ "$ci_id" =~ ^[1-9][0-9]*$ && "$ci_attempt" =~ ^[1-9][0-9]*$ ]] || {
            gate="CI identity"
            refuse "CI run identity or attempt is missing"
          }
          jq -e --argjson number "$pr_number" --arg sha "$sha" --arg base "$base_sha" --arg ref "$default_branch" '
            any(.pull_requests[]?; .number == $number and .head.sha == $sha and .base.sha == $base and .base.ref == $ref)
          ' <<<"$latest_ci" >/dev/null || {
            gate="CI association"
            refuse "CI is not bound to this pull request and current base"
          }
          jobs="$(gh api --paginate "repos/$REPOSITORY/actions/runs/$ci_id/attempts/$ci_attempt/jobs?per_page=100" --jq '.jobs[]')" || {
            gate="CI jobs"
            refuse "the exact CI attempt jobs could not be read"
          }
          proof_regex='^Verify tested merge [(]merge=(?<merge>[0-9a-f]{40}), head=(?<head>[0-9a-f]{40}), base=(?<base>[0-9a-f]{40})[)]$'
          proofs="$(jq -cs --arg sha "$sha" --arg regex "$proof_regex" '
            [.[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")
              | .steps[]? | select(.status == "completed" and .conclusion == "success")
              | .name | select(test($regex)) | capture($regex)]
          ' <<<"$jobs")"
          tested_merge="$(jq -r '.[0].merge // empty' <<<"$proofs")"
          jq -e --arg sha "$sha" --arg base "$base_sha" --arg merge "$tested_merge" '
            length > 0 and all(.[]; .head == $sha and .base == $base and .merge == $merge)
          ' <<<"$proofs" >/dev/null || {
            gate="CI merge proof"
            refuse "CI has no successful proof of the tested head/base/merge triplet"
          }
          merge_commit="$(gh api "repos/$REPOSITORY/git/commits/$tested_merge")" || {
            gate="CI merge parents"
            refuse "the tested merge commit could not be read"
          }
          jq -e --arg merge "$tested_merge" --arg head "$sha" --arg base "$base_sha" '
            .sha == $merge and (.parents | length) == 2 and .parents[0].sha == $base and .parents[1].sha == $head
          ' <<<"$merge_commit" >/dev/null || {
            gate="CI merge parents"
            refuse "the tested commit does not merge the exact head into the current base"
          }

          threads="$(gh api graphql -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { reviewThreads(first:100) { nodes { isResolved } pageInfo { hasNextPage } } } } }' -F owner="${REPOSITORY%%/*}" -F name="${REPOSITORY##*/}" -F number="$pr_number")" || {
            gate="review threads"
            refuse "review thread state could not be read"
          }
          [[ "$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$threads")" == "false" ]] || {
            gate="review threads"
            refuse "more than 100 review threads exist"
          }
          [[ "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$threads")" == "0" ]] || {
            gate="review threads"
            refuse "unresolved review threads remain"
          }

          files_json="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" --jq '.[]')" || {
            gate="changed files"
            refuse "changed files could not be read"
          }
          [[ "$(jq -s 'length' <<<"$files_json")" == "$(jq -r '.changed_files' <<<"$pr")" ]] || {
            gate="changed files"
            refuse "changed file list is incomplete (GitHub caps it at 3000)"
          }
          files="$(jq -rs '.[] | .filename, (.previous_filename // empty)' <<<"$files_json")"
          while IFS= read -r path; do
            lower="${path,,}"
            case "$lower" in
              .github/*|*/codeowners|codeowners|copilot-instructions.md|*/copilot-instructions.md|agents.md|*/agents.md|claude.md|*/claude.md|*.sql|*/migrations/*|migrations/*|*/migration/*|migration/*|dockerfile*|*/dockerfile*|*.dockerfile|compose.yml|compose.yaml|compose.*.yml|compose.*.yaml|*/compose.yml|*/compose.yaml|*/compose.*.yml|*/compose.*.yaml|.dockerignore|*/.dockerignore|docker-compose*|*/docker-compose*|vercel.json|*/vercel.json|.env|.env.*|*/.env|*/.env.*|*.env|*.env.*|*secret*|*credential*|*token*|*.pem|*.key|*.p12|*.pfx|*.crt|*.cer|*/infra/*|infra/*|*/infrastructure/*|infrastructure/*|*/terraform/*|terraform/*|*.tf|*.tfvars|*/deploy/*|deploy/*|*/deployment/*|deployment/*|src/github-merge-gates.js|src/pull-requests.js|src/api-pull-requests.js|bin/publieur.js|bin/livrer.sh|packages/schemas/commandes.js|specs/livraison.json|*deploy*.sh|*deploy*.js|*deploy*.mjs|*deploy*.cjs|*deploy*.py)
                sensitive_files="$sensitive_files, $path"
                ;;
            esac
          done <<<"$files"
          [[ "$sensitive_files" == "none" ]] || {
            gate="sensitive files"
            refuse "sensitive changed paths are not eligible"
          }

          current="$(gh api "repos/$REPOSITORY/pulls/$pr_number")" || {
            gate="final PR snapshot"
            refuse "pull request could not be re-read"
          }
          [[ "$(jq -r '.head.sha // empty' <<<"$current")" == "$sha" ]] || {
            gate="final HEAD"
            refuse "HEAD changed after validation"
          }
          [[ "$(gh api "repos/$REPOSITORY/commits/$default_branch" --jq '.sha // empty')" == "$base_sha" ]] || {
            gate="final base branch"
            refuse "base branch changed after validation; wait for fresh CI"
          }

          mergeable="$(jq -r 'if .mergeable == null then "unknown" else (.mergeable | tostring) end' <<<"$current")"
          for attempt in 1 2 3; do
            [[ "$mergeable" != "unknown" ]] && break
            sleep 5
            current="$(gh api "repos/$REPOSITORY/pulls/$pr_number")" || {
              gate="mergeability"
              refuse "mergeability could not be re-read"
            }
            mergeable="$(jq -r 'if .mergeable == null then "unknown" else (.mergeable | tostring) end' <<<"$current")"
          done
          [[ "$mergeable" == "true" ]] || {
            gate="mergeability"
            refuse "pull request is not mergeable without conflicts (state=$mergeable)"
          }
          [[ "$(jq -r '.head.sha // empty' <<<"$current")" == "$sha" ]] || {
            gate="final HEAD"
            refuse "HEAD changed during the mergeability check"
          }
          [[ "$(gh api "repos/$REPOSITORY/commits/$default_branch" --jq '.sha // empty')" == "$base_sha" ]] || {
            gate="final base branch"
            refuse "base branch changed during the mergeability check"
          }

          # Re-check mutable metadata after mergeability and file pagination.
          latest_again="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100")" || {
            gate="final CI"
            refuse "CI could not be re-read"
          }
          jq -e --arg sha "$sha" --argjson id "$ci_id" --argjson attempt "$ci_attempt" '
            (.total_count | type) == "number" and .total_count >= 0 and .total_count <= 100 and
            ([.workflow_runs[] | select(.name == "CI" and .head_sha == $sha and .event == "pull_request")]
              | sort_by(.run_number, .run_attempt) | last
              | .id == $id and .run_attempt == $attempt and .status == "completed" and .conclusion == "success")
          ' <<<"$latest_again" >/dev/null || {
            gate="final CI"
            refuse "latest CI changed after validation"
          }
          threads="$(gh api graphql -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { reviewThreads(first:100) { nodes { isResolved } pageInfo { hasNextPage } } } } }' -F owner="${REPOSITORY%%/*}" -F name="${REPOSITORY##*/}" -F number="$pr_number")" || {
            gate="final review threads"
            refuse "review threads could not be re-read"
          }
          jq -e '
            ((.errors // []) | length) == 0 and
            (.data.repository.pullRequest.reviewThreads as $t |
              ($t.nodes | type) == "array" and $t.pageInfo.hasNextPage == false and all($t.nodes[]; .isResolved == true))
          ' <<<"$threads" >/dev/null || {
            gate="final review threads"
            refuse "review threads are unresolved or unreadable"
          }
          jq -e --arg ref "$default_branch" --arg repo "$REPOSITORY" '
            .state == "open" and .draft == false and .base.ref == $ref and .head.repo.full_name == $repo and
            .mergeable == true and .mergeable_state != "blocked" and .mergeable_state != "dirty"
          ' <<<"$current" >/dev/null || {
            gate="final PR state"
            refuse "PR state changed or is blocked"
          }
          [[ "$(gh api "repos/$REPOSITORY" --jq '.default_branch')" == "$default_branch" ]] || {
            gate="final default branch"
            refuse "default branch changed after validation"
          }
          [[ "$(gh api "repos/$REPOSITORY/commits/$default_branch" --jq '.sha // empty')" == "$base_sha" ]] || {
            gate="final base branch"
            refuse "base branch changed before merge"
          }
          merge_response="$(gh api --method PUT "repos/$REPOSITORY/pulls/$pr_number/merge" -f merge_method=squash -f sha="$sha" 2>&1)" || {
            gate="merge"
            refuse "REST squash merge failed: $merge_response"
          }
          {
            echo "## Gated merge decision: merged"
            echo
            echo "- **PR:** $pr_number"
            echo "- **HEAD SHA:** $sha"
            echo "- **CI:** $ci_state"
            echo "- **Tested merge:** $tested_merge (head=$sha base=$base_sha run=$ci_id attempt=$ci_attempt)"
            echo "- **External reviews:** advisory; unresolved threads still block"
            echo "- **Sensitive files:** none"
            echo "- **Merge:** REST squash with the validated SHA"
          } >> "$GITHUB_STEP_SUMMARY"
